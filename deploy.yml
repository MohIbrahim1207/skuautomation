name: Deploy SKU Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

        run: |
          set -e

          echo "========================================"
          echo "Starting Flow Force deployment"
          echo "========================================"

          echo "Preparing SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Adding server to known_hosts..."
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          echo "Connecting to production server..."

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" << 'EOF'

            set -e

            echo "========================================"
            echo "Connected to production server"
            echo "========================================"

            cd /opt/skuautomation

            echo "Current directory:"
            pwd

            echo "========================================"
            echo "Pulling latest code from GitHub"
            echo "========================================"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "========================================"
            echo "Verifying environment configuration"
            echo "========================================"

            if [ -f .env ]; then
              if grep -q "^STORAGE_DIR=" .env; then
                sed -i 's|^STORAGE_DIR=.*|STORAGE_DIR=./storage|' .env
              else
                echo "STORAGE_DIR=./storage" >> .env
              fi
            else
              echo "STORAGE_DIR=./storage" > .env
            fi
            echo "STORAGE_DIR in /opt/skuautomation/.env:"
            grep "^STORAGE_DIR=" .env || true

            echo "========================================"
            echo "Rebuilding Flow Force Docker containers"
            echo "========================================"

            docker compose up -d --build

            echo "========================================"
            echo "Checking Docker containers"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "Waiting for application"
            echo "========================================"

            sleep 5

            echo "========================================"
            echo "Verifying volume mount & storage inside container"
            echo "========================================"

            docker compose exec -T app node -e "
              const fs = require('fs');
              const path = require('path');
              const cwd = process.cwd();
              const storageDir = process.env.STORAGE_DIR || './storage';
              const resolvedStorage = path.isAbsolute(storageDir) ? storageDir : path.resolve(cwd, storageDir);
              console.log('Container Working Directory:', cwd);
              console.log('Resolved Storage Directory:', resolvedStorage);
              console.log('Storage Directory Exists:', fs.existsSync(resolvedStorage));
            "

            echo "========================================"
            echo "Restoring missing PR documents into persistent storage"
            echo "========================================"

            docker compose exec -T app node -e "
              const { restoreMissingApprovedPrDocuments } = require('./server/services/documentGenerator');
              restoreMissingApprovedPrDocuments().then(res => {
                console.log('Document restoration result:', JSON.stringify(res, null, 2));
              }).catch(err => {
                console.error('Restoration error:', err);
              });
            "

            echo "========================================"
            echo "Testing persistence: performing container restart"
            echo "========================================"

            docker compose restart app
            sleep 5

            echo "========================================"
            echo "Checking application health"
            echo "========================================"

            curl --fail --silent --show-error \
              http://localhost:3000/health

            echo ""
            echo "========================================"
            echo "Deployment and persistence test successful!"
            echo "========================================"

          EOF

          echo "Cleaning SSH key..."

          rm -f ~/.ssh/deploy_key

          echo "========================================"
          echo "Flow Force deployment completed"
          echo "========================================"
